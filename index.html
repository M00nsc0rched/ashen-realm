<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a0c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Ashen Realm</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="loading">
        <div class="title">ASHEN REALM</div>
        <div class="subtitle">sötét fantasy kaland</div>
        <div class="bar"><div class="fill" id="progress"></div></div>
        <div class="hint" id="loading-hint">A völgy betöltése…</div>
      </div>

      <div id="rotate">
        <div class="title small">Fordítsd el a készüléket</div>
        <div class="hint">Az Ashen Realm fekvő helyzetben játszható.</div>
      </div>

      <button id="fullscreen" title="Teljes képernyő" aria-label="Teljes képernyő">⛶</button>
      <div id="banner"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#banner");
        var div = document.createElement("div");
        div.className = type === "error" ? "error" : "warning";
        div.textContent = msg;
        banner.appendChild(div);
        if (type !== "error") setTimeout(function () { banner.removeChild(div); }, 6000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "game",
        companyName: "DefaultCompany",
        productName: "Ashen Realm",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // The world renders at a fixed low resolution; only the HUD benefits from extra pixels.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2),
      };

      if (isMobile) document.body.classList.add("mobile");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        var progress = document.querySelector("#progress");
        createUnityInstance(canvas, config, function (p) {
          progress.style.width = Math.round(p * 100) + "%";
        }).then(function (instance) {
          document.querySelector("#loading").classList.add("done");
          document.querySelector("#fullscreen").onclick = function () { instance.SetFullscreen(1); };
          canvas.focus();
        }).catch(function (message) {
          document.querySelector("#loading-hint").textContent = "A völgyet nem sikerült betölteni: " + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
