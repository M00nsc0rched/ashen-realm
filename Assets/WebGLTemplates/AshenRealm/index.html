<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a0c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="loading">
        <div class="title">ASHEN REALM</div>
        <div class="subtitle">a dark fantasy vertical slice</div>
        <div class="bar"><div class="fill" id="progress"></div></div>
        <div class="hint" id="loading-hint">Loading the valley…</div>
      </div>

      <div id="rotate">
        <div class="title small">Turn your device</div>
        <div class="hint">Ashen Realm is played in landscape.</div>
      </div>

      <button id="fullscreen" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      <div id="banner"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#banner");
        var div = document.createElement("div");
        div.className = type === "error" ? "error" : "warning";
        div.textContent = msg;
        banner.appendChild(div);
        if (type !== "error") setTimeout(function () { banner.removeChild(div); }, 6000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "game",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // The world renders at a fixed low resolution; only the HUD benefits from extra pixels.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2),
      };

      if (isMobile) document.body.classList.add("mobile");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        var progress = document.querySelector("#progress");
        createUnityInstance(canvas, config, function (p) {
          progress.style.width = Math.round(p * 100) + "%";
        }).then(function (instance) {
          document.querySelector("#loading").classList.add("done");
          document.querySelector("#fullscreen").onclick = function () { instance.SetFullscreen(1); };
          canvas.focus();
        }).catch(function (message) {
          document.querySelector("#loading-hint").textContent = "The valley could not be loaded: " + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
